services:
  postgres:
    image: postgres:16
    container_name: yavirac-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      PGTZ: ${TZ}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: yavirac-n8n
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Base interna de n8n
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: ${DB_POSTGRESDB_SCHEMA}

      # Zona horaria
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}

      # Configuración LOCAL actual
      # Estas variables se cambiarán al dominio HTTPS cuando vayamos al servidor.
      WEBHOOK_URL: http://localhost:5678/
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      # Angular local
      N8N_CORS_ENABLE: "true"
      N8N_CORS_ALLOWED_ORIGINS: "http://localhost:4200"

      # Telemetría
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

      # Archivos de incidencias
      N8N_RESTRICT_FILE_ACCESS_TO: "/data/storage"

    ports:
      - "5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n
      - uploads_data:/data/storage

volumes:
  postgres_data:
  n8n_data:
  uploads_data: