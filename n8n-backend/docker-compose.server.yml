services:
  postgres:
    image: postgres:16
    container_name: yavirac-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      PGTZ: ${TZ}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - yavibot-internal

  n8n:
    image: n8nio/n8n:latest
    container_name: yavirac-n8n
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: ${DB_POSTGRESDB_SCHEMA}

      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}

      WEBHOOK_URL: https://n8n-161-97-100-110.nip.io/
      N8N_HOST: n8n-161-97-100-110.nip.io
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n-161-97-100-110.nip.io/

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

      N8N_RESTRICT_FILE_ACCESS_TO: "/data/storage"

    volumes:
      - n8n_data:/home/node/.n8n
      - uploads_data:/data/storage

    networks:
      - yavibot-internal
      - traefik-network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"

      - "traefik.http.routers.yavibot-n8n.rule=Host(`n8n-161-97-100-110.nip.io`)"
      - "traefik.http.routers.yavibot-n8n.entrypoints=websecure"
      - "traefik.http.routers.yavibot-n8n.tls=true"
      - "traefik.http.routers.yavibot-n8n.tls.certresolver=letsencrypt"

      - "traefik.http.services.yavibot-n8n.loadbalancer.server.port=5678"

volumes:
  postgres_data:
  n8n_data:
  uploads_data:

networks:
  yavibot-internal:
    driver: bridge

  traefik-network:
    external: true

