services:
  frontend:
    image: yavibot-frontend:latest
    container_name: yavibot-frontend
    restart: unless-stopped

    networks:
      - traefik-network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.yavibot-frontend.rule=Host(`app-161-97-100-110.nip.io`)"
      - "traefik.http.routers.yavibot-frontend.entrypoints=websecure"
      - "traefik.http.routers.yavibot-frontend.tls=true"
      - "traefik.http.routers.yavibot-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.yavibot-frontend.loadbalancer.server.port=80"

networks:
  traefik-network:
    external: true
